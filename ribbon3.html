<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="css/bootstrap.css">
  <style>
    .ribbon {
      align-items: center;
      justify-content: flex-start;
      background-color: red;
      padding: 0.5rem;
      display: flex;
      gap: 3em;
      scroll-behavior: smooth;
      width: auto;
      overflow-x: auto;
    }

    .ribbon-link {
      margin: auto;
      text-decoration: none;
      color: rgb(46, 46, 46);
    }

    .ribbon-link:hover {

      color: black;
      font-weight: bold;

    }

    .ribbon::-webkit-scrollbar {
      display: none;
    }
  </style>

</head>

<body>
  <nav class="ribbon">
      <a href="#home" class="ribbon-link">home</a>
      <a href="#men" class="ribbon-link">men</a>
      <a href="#women" class="ribbon-link">women</a>
      <a href="#children" class="ribbon-link">children</a>
      <a href="#diwali" class="ribbon-link">diwali</a>
      <a href="#pongal" class="ribbon-link">pongal</a>
      <a href="#christmas" class="ribbon-link">christmas</a>
      <a href="#marriage" class="ribbon-link">marriage</a>
      <a href="#engagement" class="ribbon-link">engagement</a>
      <a href="#birthday" class="ribbon-link">birthday</a>
      <a href="#none" class="ribbon-link">none</a>
      <a href="#nah" class="ribbon-link">nah</a>
      <a href="#aaa" class="ribbon-link">aaa</a>
      <a href="#zzz" class="ribbon-link">zzz</a>

  </nav>
  <script src="js/bootstrap.bundle.js"></script>
</body>

</html>
